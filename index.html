<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Windows Log Size Monitor</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 {
            margin-top: 0;
            color: #58a6ff;
            font-size: 20px;
            text-align: center;
        }
        .log-item {
            margin-bottom: 20px;
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .progress-bar {
            background-color: #21262d;
            border-radius: 6px;
            height: 12px;
            overflow: hidden;
            border: 1px solid #30363d;
        }
        .progress-fill {
            background-color: #238636;
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }
        .btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #2ea043;
        }
        .info {
            font-size: 12px;
            color: #8b949e;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>📊 Windows Log Size Monitor</h2>
    
    <div class="log-item">
        <div class="log-header">
            <span>Application.evtx</span>
            <span id="app-size">Loading...</span>
        </div>
        <div class="progress-bar">
            <div id="app-bar" class="progress-fill" style="width: 45%;"></div>
        </div>
    </div>

    <div class="log-item">
        <div class="log-header">
            <span>System.evtx</span>
            <span id="sys-size">Loading...</span>
        </div>
        <div class="progress-bar">
            <div id="sys-bar" class="progress-fill" style="width: 60%;"></div>
        </div>
    </div>

    <div class="log-item">
        <div class="log-header">
            <span>Security.evtx</span>
            <span id="sec-size">Loading...</span>
        </div>
        <div class="progress-bar">
            <div id="sec-bar" class="progress-fill" style="width: 30%;"></div>
        </div>
    </div>

    <button class="btn" onclick="refreshData()">รีเฟรชขนาดข้อมูล</button>
    <div class="info">จำลองโควตามาตรฐาน: 20,000 KB ต่อไฟล์</div>
</div>

<script>
    function refreshData() {
        // จำลองค่าขนาด KB เพื่อให้เห็นการทำงานของสเกลกราฟ (โควตาเต็มที่ 20MB หรือ 20,480 KB)
        const maxQuota = 20480;
        
        const appKb = Math.floor(Math.random() * 5000) + 8000;
        const sysKb = Math.floor(Math.random() * 4000) + 10000;
        const secKb = Math.floor(Math.random() * 6000) + 5000;

        document.getElementById('app-size').innerText = `${appKb.toLocaleString()} KB / 20 MB`;
        document.getElementById('app-bar').style.width = `${(appKb / maxQuota) * 100}%`;

        document.getElementById('sys-size').innerText = `${sysKb.toLocaleString()} KB / 20 MB`;
        document.getElementById('sys-bar').style.width = `${(sysKb / maxQuota) * 100}%`;

        document.getElementById('sec-size').innerText = `${secKb.toLocaleString()} KB / 20 MB`;
        document.getElementById('sec-bar').style.width = `${(secKb / maxQuota) * 100}%`;
    }

    // โหลดข้อมูลครั้งแรก
    refreshData();
</script>

</body>
</html>
